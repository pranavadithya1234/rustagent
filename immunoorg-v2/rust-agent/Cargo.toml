[package]
name = "rust-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.44"
dirs = "6.0.0"
notify = "8.2.0"
reqwest = { version = "0.13.3", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
sysinfo = "0.38.4"
tokio = { version = "1.52.1", features = ["full"] }
uuid = { version = "1.23.1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55.0"
